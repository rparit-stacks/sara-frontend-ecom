name = "sara-frontend-ecom"
compatibility_date = "2026-11-20"

# Static SPA: deploy the Vite build output. Having this file also stops
# `wrangler deploy` from auto-configuring the Cloudflare Vite plugin
# (which requires Vite 6+).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: rparit1934/sara-frontend
  NODE_VERSION: "20"

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://studiosara.cloud' }}
          VITE_TECHPACK_BUILDER_URL: ${{ vars.VITE_TECHPACK_BUILDER_URL || 'https://sara-techpack-builder.vercel.app' }}
        run: npm run build

  deploy:
    name: Build Docker & Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://studiosara.cloud' }}
            VITE_TECHPACK_BUILDER_URL=${{ vars.VITE_TECHPACK_BUILDER_URL || 'https://sara-techpack-builder.vercel.app' }}
            VITE_MOCKUP_API_URL=${{ vars.VITE_MOCKUP_API_URL || 'https://mock-api.studiosara.cloud' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/ecom
            docker compose pull frontend
            docker compose up -d frontend --remove-orphans
            docker image prune -f

  <rect width="400" height="400" fill="url(#weave)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <g fill="none" stroke="#2C9B8A" stroke-width="1.5" opacity=".55">
    <circle cx="200" cy="200" r="74" stroke-dasharray="10 7"/>

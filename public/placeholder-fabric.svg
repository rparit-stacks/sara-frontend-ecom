<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#E9E4D9"/>
      <rect width="16" height="2" fill="#2C9B8A" opacity=".22"/>
      <rect width="2" height="16" fill="#0B2530" opacity=".1"/>
    </pattern>
    <radialGradient id="glow" cx="75%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2C9B8A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2C9B8A" stop-opacity="0"/>
